    <title>IKEA宜家家居</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <!-- 頁首區 -->

    <header id="navbar">
        <!-- LOGO區 -->
        <h1 class="logo">
            <a href="./index.html">
                <img src="./images/IKEA_logo.svg" alt="ikea logo">
            </a>
        </h1>
        <!-- 導覽列 -->
        <nav class="navigation">
            <ul>
                <li><a href="#">產品</a></li>
                <li><a href="#">空間</a></li>

                <li><a href="#">最新活動</a></li>
            </ul>

        <a href="#">
            <img src="./images/banner.jpg" alt="ikea 30週年好禮成雙，精選商品7折起。">
        </a>
    </div>

    <!-- 主要內容區 -->
    <main>
        <!-- 餐廳介紹 -->
        <section class="restaurant">
            <figure class="rest-pt">
                <img src="./images/ikea-restaurant.jpeg" alt="ikea瑞典餐廳">
            </figure>
        </section>
        <div class="content">
            <h2>瑞典餐廳</h2>
            <p>IKEA邀請你在逛店的過程中到餐廳細細品嚐各式瑞典風味餐點！<br>
                完成購物後，不妨順道逛逛瑞典食品超市吧！<br>
                提供美味、豐富多元、永續發展的食材。<br>
                最後別忘了到美食小站來份美味熱狗、享受霜淇淋的好滋味！<br>
                瑞典美食外帶服務登場，除了瑞典餐廳，在美食小站也能買到瑞典肉丸等經典主餐！
            </p>
            <a href="#">看美食小站專屬外帶菜單 ></a>
        </div>
        <!-- api串接 -->
        <section class="api">
            <div class="col">
                <iframe src="https://www.youtube.com/embed/NsAygnI8sh4?si=taHcfp1yJTkUWnJu" title="YouTube video player"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
