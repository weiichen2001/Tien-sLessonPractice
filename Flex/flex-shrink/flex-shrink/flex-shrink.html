<!DOCTYPE html>
<html lang="zh-hant-TW">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title>flex練習</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		article {
			display:flex;
			/* justify-content: flex-end; */
			/* flex-wrap: wrap; */
			/* flex-direction: column; */
			background-color: #bbb;
			width: 600px;
			height: 100vh;
		}

		article div {
			margin:0 10px;
			flex:1
		}

		article div:nth-child(1) {
			background-color: rgb(160, 160, 231);
			
		}

		article div:nth-child(2) {
			background-color: rgb(105, 147, 119);
			
		}

		article div:nth-child(3) {
			background-color: rgb(203, 130, 130);
			
		}
		article div:nth-child(4) {
			background-color: rgb(232, 21, 127);
			
		}
	</style>
</head>

<body>
	<article>
		<div>aaaaaaaaaaa</div>
		<div>bb</div>
		<div>ccccc</div>
		<div>DDD</div>
	</article>



</body>

</html>
